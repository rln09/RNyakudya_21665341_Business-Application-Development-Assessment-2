name: Test Runner

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest unittest2 html-testRunner
    
    - name: Run unit tests
      run: |
        python -m pytest test_harness/test_units/ -v --html=results/html_reports/unit_tests.html
    
    - name: Run integration tests
      run: |
        python -m pytest test_harness/test_integration/ -v --html=results/html_reports/integration_tests.html
    
    - name: Generate test report
      run: |
        python test_harness/utils/report_generator.py
    
    - name: Upload test results
      uses: actions/upload-artifact@v2
      with:
        name: test-reports
        path: results/html_reports/